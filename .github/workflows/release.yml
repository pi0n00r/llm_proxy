name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_ref:
        description: Existing version tag to publish
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_ref || github.ref }}

      - name: Verify release tag
        env:
          EXPECTED_TAG: ${{ inputs.release_ref || github.ref_name }}
        run: test "$(git describe --tags --exact-match)" = "$EXPECTED_TAG"

      - name: Select release configuration
        id: release-config
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            git show "$GITHUB_SHA:.goreleaser.yml" > "$RUNNER_TEMP/goreleaser.yml"
            echo "path=$RUNNER_TEMP/goreleaser.yml" >> "$GITHUB_OUTPUT"
          else
            echo "path=.goreleaser.yml" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Verify release source
        env:
          CGO_ENABLED: '0'
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -count=1 -shuffle=on ./...

      - name: Run race detector
        run: go test -race -count=1 -shuffle=on ./...

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean --config ${{ steps.release-config.outputs.path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
