name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: true

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Run vet
        env:
          CGO_ENABLED: '0'
        run: go vet ./...

      - name: Run tests
        env:
          CGO_ENABLED: '0'
        run: go test -count=1 -shuffle=on ./...

      - name: Run race detector
        run: go test -race -count=1 -shuffle=on ./...
